<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>만화카페 도도 MENU</title>
<style>
:root {
  --bg: #f7f5f0;
  --card: #ffffff;
  --ink: #171717;
  --muted: #77716a;
  --line: #e9e4dc;
  --accent: #1f5a4a;
  --accent-soft: #e8f0ed;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
               "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
.top {
  padding: 18px 14px 10px;
  text-align: center;
  background: var(--bg);
}
.brand {
  font-weight: 900;
  font-size: 22px;
  letter-spacing: -0.7px;
}
.sub {
  margin-top: 4px;
  font-size: 12px;
  color: var(--muted);
}
.sticky {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(247,245,240,.96);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.search-wrap {
  padding: 8px 10px 6px;
}
#search {
  width: 100%;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 14px;
  outline: none;
}
#search:focus {
  border-color: #b7afa4;
}
.categories {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 3px 10px 9px;
  scrollbar-width: none;
}
.categories::-webkit-scrollbar { display:none; }
.cat-btn {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 999px;
  padding: 8px 11px;
  font-size: 12px;
  font-weight: 700;
  color: #4c4945;
  cursor: pointer;
}
.cat-btn.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.content {
  padding: 12px 8px 30px;
  max-width: 1180px;
  margin: 0 auto;
}
.section-title {
  margin: 16px 3px 9px;
  font-size: 17px;
  font-weight: 900;
  letter-spacing: -0.4px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.card {
  min-width: 0;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 13px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(20,20,20,.035);
}
.image-box {
  aspect-ratio: 1 / 1;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  border-bottom: 1px solid #f0ece6;
  padding: 5px;
}
.image-box img {
  width: 100%;
  height: 100%;
  object-fit: contain; /* 사진 안 잘리게 전체 표시 */
  display: block;
}
.placeholder {
  width: 100%;
  height: 100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#aaa39b;
  font-size:11px;
  line-height:1.3;
  background:#faf9f7;
}
.info {
  padding: 8px 7px 9px;
}
.name {
  font-size: 12px;
  font-weight: 800;
  line-height: 1.28;
  min-height: 31px;
  word-break: keep-all;
  overflow-wrap: anywhere;
  letter-spacing: -0.3px;
}
.price {
  margin-top: 5px;
  font-size: 13px;
  font-weight: 900;
  color: var(--accent);
}
.empty {
  text-align:center;
  color:var(--muted);
  padding:50px 10px;
  font-size:14px;
}
.footer {
  padding: 18px 10px 35px;
  text-align:center;
  color:#99928a;
  font-size:11px;
}
@media (min-width: 600px) {
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .content { padding-left: 14px; padding-right: 14px; }
  .name { font-size: 13px; }
}
@media (min-width: 900px) {
  .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}
@media (min-width: 1200px) {
  .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">만화카페 도도 MENU</div>
  <div class="sub">메뉴 사진과 가격을 한눈에 확인하세요</div>
</header>

<div class="sticky">
  <div class="search-wrap">
    <input id="search" type="search" placeholder="메뉴 검색" autocomplete="off">
  </div>
  <nav class="categories" id="categories"></nav>
</div>

<main class="content" id="content"></main>
<footer class="footer">만화카페 도도 · 메뉴 및 가격은 매장 사정에 따라 변경될 수 있습니다.</footer>

const CATEGORY_ORDER = ["신메뉴(NEW)", "커피 음료", "음료", "스노우 음료", "떡볶이", "식사류", "면요리", "튀김요리", "와플", "아이스크림", "디저트"];
let selectedCategory = "전체";
let query = "";

const categoriesEl = document.getElementById("categories");
const contentEl = document.getElementById("content");
const searchEl = document.getElementById("search");

function money(n) {
  return Number(n).toLocaleString("ko-KR") + "원";
}

function visibleMenus() {
  return MENUS.filter(m => {
    if (m.status && m.status !== "판매중") return false;
    const categoryOk = selectedCategory === "전체" || m.category === selectedCategory;
    const q = query.trim().toLowerCase();
    const searchOk = !q || m.name.toLowerCase().includes(q) || m.category.toLowerCase().includes(q);
    return categoryOk && searchOk;
  });
}

function renderCategories() {
  const available = new Set(MENUS.filter(m => !m.status || m.status === "판매중").map(m => m.category));
  const cats = ["전체", ...CATEGORY_ORDER.filter(c => available.has(c))];
  categoriesEl.innerHTML = cats.map(cat => `
    <button class="cat-btn ${cat === selectedCategory ? "active" : ""}" data-cat="${cat}">${cat}</button>
  `).join("");

  categoriesEl.querySelectorAll(".cat-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      selectedCategory = btn.dataset.cat;
      renderCategories();
      renderMenus();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
}

function card(m) {
  const image = m.image
    ? `<img src="${m.image}" alt="${m.name}" loading="lazy">`
    : `<div class="placeholder">이미지<br>준비중</div>`;

  return `
    <article class="card">
      <div class="image-box">${image}</div>
      <div class="info">
        <div class="name">${m.name}</div>
        <div class="price">${money(m.price)}</div>
      </div>
    </article>
  `;
}

function renderMenus() {
  const rows = visibleMenus();
  if (!rows.length) {
    contentEl.innerHTML = `<div class="empty">검색 결과가 없습니다.</div>`;
    return;
  }

  if (selectedCategory !== "전체" || query.trim()) {
    contentEl.innerHTML = `<div class="grid">${rows.map(card).join("")}</div>`;
    return;
  }

  const byCat = new Map();
  rows.forEach(m => {
    if (!byCat.has(m.category)) byCat.set(m.category, []);
    byCat.get(m.category).push(m);
  });

  let out = "";
  CATEGORY_ORDER.forEach(cat => {
    const items = byCat.get(cat);
    if (!items || !items.length) return;
    out += `<section>
      <h2 class="section-title">${cat}</h2>
      <div class="grid">${items.map(card).join("")}</div>
    </section>`;
  });
  contentEl.innerHTML = out;
}
